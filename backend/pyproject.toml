[project]
name = "demilew-portfolio-backend"
version = "0.1.0"
description = "FastAPI backend for the Demilew portfolio"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "psycopg2-binary>=2.9,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "email-validator>=2.0,<3.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0,<3.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.28,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
